  <div class='div-other'><div class="div-other"><p data-head-level="2" class="head">種子法爾熏生頌</p><ul class="no-marker"><li>一、法爾唯無覆，熏生通三性，無記通善惡，善通有無漏。</li>
<li>二、有覆通三性，無覆唯無記，有漏通無覆，無漏唯是善。</li>
<li>三、有覆始終有，無覆終無始，有為無漏種，有始而無終。</li>
</ul><p class="byline"><span class='lineInfo' line='1289a05'></span><span class='doube-line-note'>(見海刊四卷十一期)</span></p>
