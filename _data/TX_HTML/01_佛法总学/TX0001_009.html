<p class="" style="margin-left:0em;text-indent:2em"><span class='lineInfo' line='0317a10'></span>依此遍觀佛祖經論義語，悉可判解。今震旦人學佛雖多，遵故蹈常猶不能及，無別宗義開建。近歐陽漸與梁漱溟二君頗能有言，歐陽君能善說大乘不共二諦；梁君所言，僅齊三論顯說，其密指者似在禪宗而未能達。</p>
<p class="byline"><span class='lineInfo' line='0317a12'></span><span class='doube-line-note'>(見海刊一卷六期)</span></p>
